kind: Domain
version: "1.0"

domain:
  id: dom-compliance
  name:
    en: "Compliance"
  description:
    en: >
      PharmaCo's compliance domain responsible for regulatory transparency,
      transfer-of-value reporting, audit readiness, and ensuring adherence
      to Sunshine Act, EFPIA Disclosure Code, and third-party licensing terms.
