    - pol-efpia
    - pol-iqvia-license

  useCases:
    - uc-sunshine-act

  businessObjectives:
    - bo-regulatory-excellence

  stakeholders:
    - "Compliance Officer"
    - "Legal"
    - "Internal Audit"

  status: active
  tags: ["compliance", "sunshine-act", "efpia", "tov", "audit"]
